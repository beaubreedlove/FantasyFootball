    - paragraph [ref=e108]: Tiebreaker only appears where two teams are actually level on wins. Our rule compares the most recent week first and works backwards until someone is ahead — both of this week's ties broke immediately on week 8, so one week is all it takes. Showtime's 2-0 beats Flowers For Charlie's 0-2, and XXI's 2-0 beats The Nightman Re-Cometh's 0-2. A dash means nobody is tied with you. The red line marks the playoff cut.
    - generic [ref=e109]:
      - generic [ref=e110]:
        - heading "Why the top seeds matter" [level=3] [ref=e111]
        - list [ref=e112]:
          - listitem [ref=e113]: Seeds 1 and 2 get a bye through week 15.
          - listitem [ref=e114]: Seed 1 also chooses its week-16 opponent from the week-15 winners.
          - listitem [ref=e115]: Seed 3 chooses its week-15 opponent from seeds 4, 5 and 6.
          - listitem [ref=e116]: Seeds 4, 5 and 6 are all in the playoffs — there is simply nothing separating them. No bye, no choice, you play whoever is left. That's why they're grouped together everywhere below.
      - generic [ref=e117]:
        - heading "This order is not Yahoo's order" [level=3] [ref=e118]
        - paragraph [ref=e119]: "Yahoo breaks ties on points. We don't — our rule is most recent weekly records counting backwards. It already matters: XXI (8-8) sits ahead of The Nightman Re-Cometh (8-8) here on a week-8 2-0 against an 0-2, even though Nightman has scored 2.91 more points on the season. Yahoo shows that pair the other way round."
  - generic [ref=e120]:
