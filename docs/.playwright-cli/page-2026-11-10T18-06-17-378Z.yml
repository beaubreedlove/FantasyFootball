      - generic [ref=e122]: Team by team
      - heading "Clinching scenarios, win range, and odds" [level=2] [ref=e123]
    - paragraph [ref=e124]: "I simulated one billion ways the rest of the season could play out, and the odds below are how often each team finished on each seed. One exception: It's Allen The Hips never landed the 1 seed in any of the billion — it isn't impossible, it just requires all twelve teams to finish at exactly 14-14, so that single figure is counted exactly rather than sampled."
    - list [ref=e125]:
      - listitem [ref=e126]: "Win range — the final win total out of 28: the fewest you could finish with and still land on that seed, through the most."
      - listitem [ref=e127]: Odds — your chance of landing exactly there.
      - listitem [ref=e128]: What guarantees it — every route that locks up that seed no matter what anyone else does.
    - paragraph [ref=e129]: W9 is your week-9 matchup, M13 the week-13 median. You have twelve games left, not six — each week you play your opponent and the league median, and both count the same.
