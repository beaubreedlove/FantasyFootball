  - contentinfo [ref=e269]:
    - paragraph [ref=e270]: "Assuming no ties. Every number here assumes no tied matchups and no tied medians — scores always separate. Ties in the standings are handled in full, using the league rule: most ties, then most recent weekly records counting backwards from week 14, then points. That points tiebreak can never actually be reached, because every pair of teams meets at least once during the season and in that week their records cannot be equal."
    - paragraph [ref=e271]: Where the numbers come from. Each simulated week is drawn as a random ordering of all twelve teams — equal weight, nobody rated better than anybody else. Everything else — the clinching scenarios, the help needed, and the win ranges — is exact, solved against every schedule-feasible way weeks 10 through 14 could finish. Records and scores verified against Yahoo's own standings.