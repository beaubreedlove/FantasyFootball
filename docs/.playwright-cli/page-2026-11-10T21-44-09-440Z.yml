    - paragraph [ref=e114]: Tiebreaker only appears where two teams are actually level on wins. Our rule compares the most recent week first and works backwards until someone is ahead — both of this week's ties broke immediately on week 9, so one week is all it takes. Showtime's 2-0 beats Flush It Down's 1-1, and Chasing Nabors' 2-0 beats You Give Love A Brad Name's 1-1. A dash means nobody is tied with you. The red line marks the playoff cut.
    - generic [ref=e115]:
      - generic [ref=e116]:
        - heading "Where the playoff line falls" [level=3] [ref=e117]
        - paragraph [ref=e118]: "Averaging the 6 seed's wins with the 7 seed's across a billion seasons: mean 13.996, median 14.0, mode 14.0 — 14 wins is the bubble in 26.1% of seasons, and 13 through 15 covers 90%."
        - paragraph [ref=e119]: "Practical read: 15 wins should get you in, 14 is a coin flip, 13 probably isn't enough."
      - generic [ref=e120]:
        - heading "Why the top seeds matter" [level=3] [ref=e121]
        - list [ref=e122]:
          - listitem [ref=e123]: Seeds 1 and 2 get a bye through week 15.
          - listitem [ref=e124]: Seed 1 also chooses its week-16 opponent from the week-15 winners.
          - listitem [ref=e125]: Seed 3 chooses its week-15 opponent from seeds 4, 5 and 6.
          - listitem [ref=e126]: Seeds 4, 5 and 6 are all in the playoffs — there is simply nothing separating them. No bye, no choice, you play whoever is left. That's why they're grouped together everywhere below.
      - generic [ref=e127]:
        - heading "This order is not Yahoo's order" [level=3] [ref=e128]
        - paragraph [ref=e129]: "Yahoo breaks ties on points. We don't — our rule is most recent weekly records counting backwards. It already matters: XXI (8-8) sits ahead of The Nightman Re-Cometh (8-8) here on a week-9 2-0 against an 0-2, even though Nightman has scored 2.91 more points on the season. Yahoo shows that pair the other way round."
